name: proto-web-preview (temporary)

on:
  workflow_dispatch:
  push:
    branches: [proto/reading-explanation]

jobs:
  build:
    if: github.ref == 'refs/heads/proto/reading-explanation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - name: Point ukalab_core at main dbcd197 (runner only, not committed)
        run: |
          sed -i 's/ref: 83ac22a0ffb0ad54a5ee0b1e25be5f0c1f66b1a9/ref: dbcd197346f27b5bb511850aeaa1eac6e14c5a5e/' pubspec.yaml
          grep -n "ref: dbcd197346f27b5bb511850aeaa1eac6e14c5a5e" pubspec.yaml
      - run: flutter pub get
      - run: grep -n -A6 "^  ukalab_core:" pubspec.lock
      - name: analyze (log only)
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.log
      - name: test (log only)
        continue-on-error: true
        run: |
          timeout 25m flutter test --no-pub -r expanded > test_full.log 2>&1 || true
          grep -nE '\[E\]|Some tests failed|All tests passed|\+[0-9]+.*-[0-9]+' test_full.log | tail -n 150 > test.log
          tail -n 60 test_full.log >> test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-logs
          path: |
            analyze.log
            test.log
            test_full.log
          retention-days: 1
