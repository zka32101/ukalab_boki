# 【一時・試作ブランチ限定】pubspec.yaml の ukalab_core 参照を SHA に変えたため、
# pub get が書き出す pubspec.lock を成果物として取り出す。取り出したらこのファイルは削除する。
name: proto-lock-tmp
on:
  push:
    branches: [proto/reading-explanation]
    paths: ['.github/workflows/proto-lock-tmp.yml']
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
