name: ukalab_boki3
description: "うかラボ 簿記3級 — 日商簿記検定3級の学習アプリ（非公式）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # うかラボ共通基盤（タグ固定。main は参照しない。詳細: docs/common_kit_notes.md）
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v1.8.0
  ukalab_core:
    git:
      url: https://github.com/zka32101/ukalab_core.git
      ref: v0.27.0

  flutter_riverpod: ">=2.5.1 <3.0.0"
  shared_preferences: ^2.3.0

  # google_mobile_ads は 5.3.1 以上（4.x は UMP API がなくビルド不可。kanken で実績あり）
  google_mobile_ads: ">=5.3.1 <10.0.0"
  # ながら学習モードの読み上げ（端末標準の音声合成）
  purchases_flutter: ">=9.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exam/
